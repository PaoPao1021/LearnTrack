services:
  learntrack:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      LT_HOST: 0.0.0.0
      LT_DATA_DIR: /data
      LT_BACKUP_DIR: /backups
      # Local HTTP compose only. Production uses docker-compose.prod.yml.
      LT_COOKIE_SECURE: "false"
      LT_TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - lt-data:/data
      - lt-backups:/backups

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - learntrack
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  lt-data:
  lt-backups:
