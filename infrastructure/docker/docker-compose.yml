services:
  learntrack:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - LT_HOST=0.0.0.0
      - LT_DATA_DIR=/data
      - LT_BACKUP_DIR=/backups
      # The bundled Nginx config is HTTP-only. Set true only after enabling TLS.
      - LT_COOKIE_SECURE=false
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - lt-data:/data
      - lt-backups:/backups

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - learntrack
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  lt-data:
  lt-backups:
