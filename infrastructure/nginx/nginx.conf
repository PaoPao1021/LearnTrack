# LearnTrack Nginx 反向代理（生产使用 HTTPS 时替换 certs 并启用 443 server 块）
server {
  listen 80;
  server_name _;

  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://learntrack:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 前端静态资源（API 容器暂不托管静态文件时，可挂载 dist 到这里）
  location / {
    proxy_pass http://learntrack:8787;
    proxy_set_header Host $host;
  }
}
