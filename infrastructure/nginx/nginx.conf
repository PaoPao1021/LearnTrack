# LearnTrack 本机 HTTP 反向代理。公网生产环境请使用 Caddy 配置。
server {
  listen 80;
  server_name _;

  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://learntrack:8787;
    proxy_set_header Host $host;
    # 覆盖任何来自客户端的伪造转发头；API 只信任这一层代理。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 前端静态资源（API 容器暂不托管静态文件时，可挂载 dist 到这里）
  location / {
    proxy_pass http://learntrack:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
